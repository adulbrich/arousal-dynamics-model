version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current through reviewed PRs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  # Python dependencies and uv.lock, grouped so a week's bumps arrive as one
  # PR. A bump that moves a golden trajectory fails the test matrix, which is
  # the point: numpy or scipy changing the model's output deserves a look.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      astral:
        patterns:
          - ruff
          - ty
      all-other:
        patterns:
          - "*"
        exclude-patterns:
          - ruff
          - ty
