[project]
name = "arousal-dynamics"
version = "0.1.0"
description = "Light-driven arousal dynamics model after Postnova et al. 2016 and 2018, Abeysuriya et al. 2018, and Tekieh et al. 2020."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Ulbrich" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.10.8"]
pandas = ["pandas>=2.2"]

[project.urls]
Repository = "https://github.com/adulbrich/arousal-dynamics-model"

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "arousal-dynamics[pandas,plot]",
    "hypothesis>=6.170.2",
    "ipykernel>=7",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "lefthook==2.2.2",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-regressions>=2.11",
    "ruff==0.17.1",
    "ty==0.0.89",
]
notebooks = [
    "jupyterlab>=4",
]

[tool.uv]
# The lockfile is written by this version and CI pins the same one in
# `.github/workflows/`. Older uv cannot read every field it writes.
required-version = ">=0.13.2"

[tool.ruff]
line-length = 100
# lefthook passes staged paths explicitly; without this, ruff would lint an
# excluded file whenever it is staged, for example when archived notebooks move.
force-exclude = true
extend-exclude = [
    # Notebooks from before the library, kept as history; they import the
    # pre-library modules and no longer run.
    "notebooks/archive/",
    # Research notes quote the legacy code verbatim in their code blocks.
    "docs/research/",
]

[tool.ruff.lint]
select = [
    "A",    # builtins shadowing
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # docstrings, numpy convention below
    "E",
    "ERA",  # commented-out code
    "F",
    "FURB",
    "I",    # import order
    "N",    # naming
    "NPY",  # numpy-specific
    "PERF",
    "PIE",
    "PL",   # pylint subset
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "RET",
    "RUF",
    "S",    # bandit
    "SIM",
    "T20",  # print
    "TID",
    "UP",   # pyupgrade
    "W",
]
ignore = [
    # The model's variables are the papers' symbols (V_v, V_m, H, X, Y, Q_v,
    # Theta_L). Renaming them to snake_case would break the one-to-one reading
    # against the equations, which matters more here than PEP 8.
    "N802",
    "N803",
    "N806",
    "N815",
    "N816",
    # Equations are full of literal coefficients from the papers.
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "D", "S101"]  # toy models ignore arguments by design
"notebooks/**" = ["T201"]  # notebooks print their results
"scripts/**" = ["S603", "S607", "T201"]  # git with fixed arguments; CLI output

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ty.environment]
# The gate scripts import each other as top-level modules, as `python
# scripts/<name>.py` runs them.
extra-paths = ["scripts"]

[tool.ty.src]
exclude = ["notebooks/archive/"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "src"]
# The gate scripts are tested from `scripts/`; the package itself is installed.
pythonpath = ["scripts"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--doctest-modules",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: takes more than a few seconds; skipped by the pre-push hook",
    "validation: compares against reference data in data/, skipped when it is absent",
]

[tool.coverage.run]
branch = true
source = ["arousal_dynamics"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]
